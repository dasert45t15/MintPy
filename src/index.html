<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; media-src http://127.0.0.1:3737; connect-src http://127.0.0.1:3737;">
  <title>MintPy — Zen audio player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="ico-home" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v10h5v-6h4v6h5V10"/></symbol>
    <symbol id="ico-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="ico-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z" fill="currentColor"/></symbol>
    <symbol id="ico-heart-o" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
    <symbol id="ico-playlist" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="ico-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3Z"/></symbol>
    <symbol id="ico-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l-2-.7-.7-1.7.9-1.9-2.1-2.1-1.9.9-1.7-.7-.7-2h-3l-.7 2-1.7.7-1.9-.9-2.1 2.1.9 1.9-.7 1.7-2 .7v3l2 .7.7 1.7-.9 1.9 2.1 2.1 1.9-.9 1.7.7.7 2h3l.7-2 1.7-.7 1.9.9 2.1-2.1-.9-1.9.7-1.7Z"/></symbol>
    <symbol id="ico-shuffle" viewBox="0 0 24 24"><path d="M4 7h3l10 10h3M17 4l3 3-3 3M4 17h3l3-3M17 14l3 3-3 3"/></symbol>
    <symbol id="ico-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zm3 7 10 7V5Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="ico-play" viewBox="0 0 24 24"><path d="m7 4 12 8-12 8Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="ico-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="ico-next" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7Zm11 0h2v14h-2Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="ico-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="ico-volume" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4Zm4 4a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></symbol>
    <symbol id="ico-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="ico-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    <symbol id="ico-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13M9 8l12-2"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
    <symbol id="ico-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="ico-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="ico-maximize" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/></symbol>
  </svg>

  <div id="app" class="app-window">
    <canvas id="sakura-canvas" aria-hidden="true"></canvas>
    <div class="rising-sun" aria-hidden="true"></div>
    <div class="ink-mountain ink-mountain-left" aria-hidden="true"></div>
    <div class="ink-mountain ink-mountain-right" aria-hidden="true"></div>
    <header class="titlebar">
      <div class="drag-bar"></div>
      <div class="title-brand"><img class="brand-logo" src="../assets/mintpy-logo.png" alt=""><span>MintPy</span><small>静かな音</small></div>
      <div class="katana-header" aria-hidden="true">
        <svg viewBox="0 0 560 24" preserveAspectRatio="none">
          <defs><linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#c9c5bd"/><stop offset="1" stop-color="#5d5a54"/></linearGradient></defs>
          <rect x="34" y="9" width="74" height="7" rx="2" fill="#2a2420"/><path d="m39 9 8 7m4-7 8 7m4-7 8 7m4-7 8 7m4-7 8 7" stroke="#a01f2c"/>
          <rect x="108" y="5" width="7" height="15" rx="2" fill="#af873e"/><path d="M115 9h402q13 0 23 4l-23 4H115Z" fill="url(#blade)"/>
        </svg>
      </div>
      <div class="win-btns">
        <button class="wb" id="winMin" aria-label="Minimize"><svg class="ico"><use href="#ico-minus"/></svg></button>
        <button class="wb" id="winMax" aria-label="Maximize"><svg class="ico"><use href="#ico-maximize"/></svg></button>
        <button class="wb close" id="winClose" aria-label="Close"><svg class="ico"><use href="#ico-close"/></svg></button>
      </div>
    </header>

    <div class="grid">
      <aside class="sidebar panel">
        <div class="brand-block"><img class="sidebar-logo" src="../assets/mintpy-logo.png" alt=""><span class="brand-jp">音の間</span><h1>MintPy</h1><p>ZEN AUDIO PLAYER</p></div>
        <nav aria-label="Main navigation">
          <button class="nav-btn active" data-view="home"><svg class="ico"><use href="#ico-home"/></svg><span>Home<small>ホーム</small></span></button>
          <button class="nav-btn" data-view="search"><svg class="ico"><use href="#ico-search"/></svg><span>Search<small>検索</small></span></button>
          <button class="nav-btn" data-view="favorites"><svg class="ico"><use href="#ico-heart"/></svg><span>Favorites<small>お気に入り</small></span></button>
          <button class="nav-btn" data-view="playlists"><svg class="ico"><use href="#ico-playlist"/></svg><span>Playlists<small>再生リスト</small></span></button>
          <button class="nav-btn" data-view="library"><svg class="ico"><use href="#ico-folder"/></svg><span>Library<small>音楽庫</small></span></button>
          <button class="nav-btn settings-link" data-view="settings"><svg class="ico"><use href="#ico-settings"/></svg><span>Settings<small>設定</small></span></button>
        </nav>
        <blockquote><span>古池や<br>蛙飛びこむ<br>水の音</span><small>— 松尾芭蕉</small></blockquote>
      </aside>

      <main class="content" id="viewRoot">
        <div class="content-inner panel" id="contentInner"></div>
      </main>

      <aside class="queue panel">
        <div class="section-heading"><span><small>NEXT</small> Up next</span><b>次</b></div>
        <div id="queueList" class="queue-list"></div>
      </aside>

      <footer class="player-bar panel">
        <div class="np-info">
          <div class="art-container"><img id="npArt" src="" alt=""></div>
          <div class="track-meta"><span id="npTitle">Nothing playing</span><span id="npArtist" class="muted">Choose a track to begin</span></div>
        </div>
        <div class="np-controls">
          <div class="ctrl-row">
            <button class="icon-btn" id="shuffleBtn" title="Shuffle"><svg class="ico"><use href="#ico-shuffle"/></svg></button>
            <button class="icon-btn" id="prevBtn" title="Previous"><svg class="ico"><use href="#ico-prev"/></svg></button>
            <button class="play-btn" id="playBtn" title="Play"><svg class="ico"><use href="#ico-play"/></svg></button>
            <button class="icon-btn" id="nextBtn" title="Next"><svg class="ico"><use href="#ico-next"/></svg></button>
            <button class="icon-btn" id="repeatBtn" title="Repeat"><svg class="ico"><use href="#ico-repeat"/></svg></button>
          </div>
          <div class="seek-row">
            <span id="curTime" class="time-lbl">0:00</span>
            <div class="seek-bar" id="seekBar"><i></i><i></i><i></i><div class="seek-fill" id="seekFill"></div></div>
            <span id="totTime" class="time-lbl">0:00</span>
          </div>
        </div>
        <div class="np-volume"><svg class="ico"><use href="#ico-volume"/></svg><div class="vol-bar" id="volBar"><div class="vol-fill" id="volFill"></div></div><span class="volume-label">音量</span></div>
      </footer>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
